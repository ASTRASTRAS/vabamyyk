<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eesti müügikaart</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 1;
    }

    #panel {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 10px;
      z-index: 9999;
      box-sizing: border-box;
      width: 320px;
      max-width: calc(100vw - 20px);
      padding: 12px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
    }

    #panel input,
    #panel select,
    #panel button,
    #listing-form input,
    #listing-form select,
    #listing-form textarea,
    #listing-form button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 8px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 7px;
      background: #398b36;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #286f26;
    }

    .secondary-button {
      background: #1565c0;
    }

    .secondary-button:hover {
      background: #0d47a1;
    }

    #status {
      color: #555;
      font-size: 14px;
    }

    #banners {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      z-index: 10000;
      pointer-events: auto;
    }

    .banner {
      height: 42px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: #58a947;
      border-top: 1px solid #287b28;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .banner-track {
      display: flex;
      width: max-content;
      color: #000;
      text-decoration: none;
      cursor: pointer;
      animation: move-banner 22s linear infinite;
    }

    .banner-track span {
      display: block;
      padding-right: 100px;
    }

    .banner.second .banner-track {
      animation-duration: 18s;
    }

    .banner.third .banner-track {
      animation-duration: 25s;
    }

    #copyright {
      position: fixed;
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom, 0px);
      z-index: 10001;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #333;
      font-size: 12px;
      text-align: center;
    }

    #listing-modal {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, .55);
      box-sizing: border-box;
    }

    #listing-modal.visible {
      display: flex;
    }

    .modal-box {
      box-sizing: border-box;
      width: 100%;
      max-width: 520px;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: 20px;
      background: white;
      border-radius: 14px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    #listing-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    #form-result {
      padding: 10px;
      border-radius: 6px;
      line-height: 1.45;
    }

    .success {
      background: #e4f7e4;
      color: #155d15;
    }

    .error {
      background: #ffe5e5;
      color: #9d1515;
    }

    @keyframes move-banner {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (max-width: 700px) {
      #panel {
        top: calc(8px + env(safe-area-inset-top, 0px));
        width: calc(100vw - 20px);
        padding: 10px;
      }

      #banners {
        bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      }

      .banner {
        height: 38px;
        font-size: 15px;
      }

      .modal-box {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="panel">
    <input id="search" placeholder="Otsi nime, tänava või linna järgi">

    <select id="filter">
      <option value="all">Kategooria</option>
      <option value="hooaja toit">Hooaja toit</option>
      <option value="kodukohvik">Kodukohvik</option>
      <option value="käsitöö">Käsitöö</option>
      <option value="garaažimüük">Garaažimüük</option>
      <option value="hoovimüük">Hoovimüük</option>
      <option value="second-hand">Second-hand</option>
      <option value="riided">Riided</option>
      <option value="raamatud">Raamatud</option>
      <option value="uunikum">Uunikum</option>
      <option value="vanavara">Vanavara</option>
      <option value="tasuta">Tasuta</option>
    </select>

    <button type="button" onclick="applyFilters()">Rakenda</button>
    <button type="button" class="secondary-button" onclick="openCreateForm()">Lisa müügikoht</button>

    <div id="status">Laadin andmeid…</div>
  </div>

  <div id="map"></div>

  <div id="listing-modal">
    <div class="modal-box">
      <h2 id="form-title">Lisa müügikoht</h2>

      <form id="listing-form">
        <input id="form-name" required placeholder="Nimi">

        <input id="form-address" required placeholder="Aadress, näiteks Pikk 10, Tallinn">

        <input id="form-date" type="date" required>

        <input id="form-time" type="time" required>

        <select id="form-category">
          <option value="">Kategooria (soovi korral)</option>
          <option value="Hooaja toit">Hooaja toit</option>
          <option value="Kodukohvik">Kodukohvik</option>
          <option value="Käsitöö">Käsitöö</option>
          <option value="Garaažimüük">Garaažimüük</option>
          <option value="Hoovimüük">Hoovimüük</option>
          <option value="Second-hand">Second-hand</option>
          <option value="Riided">Riided</option>
          <option value="Raamatud">Raamatud</option>
          <option value="Uunikum">Uunikum</option>
          <option value="Vanavara">Vanavara</option>
          <option value="Tasuta">Tasuta</option>
        </select>

        <textarea id="form-description" required placeholder="Kirjeldus"></textarea>

        <input id="form-phone" required placeholder="Telefon või e-post">

        <input id="form-website" type="url" placeholder="Veebiaadress (soovi korral)">

        <button id="submit-button" type="submit">Avalda</button>
        <button type="button" class="secondary-button" onclick="closeForm()">Sulge</button>
      </form>

      <div id="form-result"></div>
    </div>
  </div>

  <div id="banners">
    <div class="banner">
      <a class="banner-track"
         href="https://www.facebook.com/profile.php?id=61592129100126"
         target="_blank"
         rel="noopener noreferrer"
         data-text="Soovite reklaamida oma ettevõtet esilehel? Võtke ühendust.">
      </a>
    </div>

    <div class="banner second">
      <a class="banner-track"
         href=""
         target="_blank"
         rel="noopener noreferrer"
         data-text="Siin saad reklaamida oma ettevõtet!">
      </a>
    </div>

    <div class="banner third">
      <a class="banner-track"
         href="https://docs.google.com/forms/d/e/1FAIpQLSc9ekH4rgdLi--I9XknxFnerg-azQQKPHqoftVcQgkGMIauzQ/viewform"
         target="_blank"
         rel="noopener noreferrer"
         data-text="Aseta oma ettevõtmine kaardile. Tasuta eraisikule ja üksikisikust ettevõtjale. Täida blankett.">
      </a>
    </div>
  </div>

  <div id="copyright">© 2026. www.myygikaart.ee. All rights reserved.</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwfRrG_WXEgPD_HMJPh5LlitsC9QtWarrey3Ei8-zUJGDgfbQLdE3W4MawtNPC7pgnZ/exec";

    const estoniaCenter = [58.7, 25.0];
    const estoniaZoom = 7;

    const map = L.map("map").setView(estoniaCenter, estoniaZoom);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const markers = L.markerClusterGroup();
    map.addLayer(markers);

    let allData = [];
    let editToken = "";

    function fillBanners() {
      document.querySelectorAll(".banner-track").forEach(track => {
        const text = track.dataset.text;
        track.innerHTML = "";

        while (track.scrollWidth < window.innerWidth * 2) {
          const item = document.createElement("span");
          item.textContent = text;
          track.appendChild(item);
        }

        track.innerHTML += track.innerHTML;
      });
    }

    function getValue(row, names) {
      for (const name of names) {
        if (row[name] !== undefined && row[name] !== null) {
          return String(row[name]).trim();
        }
      }
      return "";
    }

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function getCategories(row) {
      return getValue(row, [
        "Kaubatüüp",
        "kaubatüüp",
        "Kauba tüüp",
        "kauba tüüp",
        "Kategooria",
        "kategooria"
      ])
        .split(/[;,]/)
        .map(category => normalize(category))
        .filter(Boolean);
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createWebLink(row) {
      const webText = getValue(row, [
        "Veeb", "veeb", "Veebiaadress", "veebiaadress",
        "URL", "url", "Link", "link"
      ]);

      if (!webText) return "Veeb puudub";

      try {
        const address = /^https?:\/\//i.test(webText)
          ? webText
          : "https://" + webText;

        const url = new URL(address);

        return `<a href="${escapeHTML(url.href)}" target="_blank" rel="noopener noreferrer">Ava veebileht</a>`;
      } catch {
        return "Vigane veebiaadress";
      }
    }

    async function loadListings() {
      try {
        const response = await fetch(`${API_URL}?action=list`);
        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || "Andmete laadimine ebaõnnestus.");
        }

        allData = result.data;
        renderMarkers(allData);

        document.getElementById("status").textContent =
          `Laaditud kuulutusi: ${allData.length}`;
      } catch (error) {
        document.getElementById("status").textContent =
          "Andmete laadimine ebaõnnestus.";
      }
    }

    function renderMarkers(data) {
      markers.clearLayers();

      data.forEach(row => {
        const lat = parseFloat(getValue(row, ["Latitude", "latitude", "Laiuskraad"]));
        const lng = parseFloat(getValue(row, ["Longitude", "longitude", "Pikkuskraad"]));

        if (isNaN(lat) || isNaN(lng)) return;

        const marker = L.marker([lat, lng]);

        marker.bindPopup(`
          <b>${escapeHTML(getValue(row, ["Nimi", "nimi"]))}</b><br>
          ${escapeHTML(getValue(row, ["Aadress", "aadress"]))}<br>
          🏙 ${escapeHTML(getValue(row, ["Linn", "linn"]))}<br>
          ${escapeHTML(getValue(row, ["Mobiilinumber/E-post", "mobiilinumber/e-post"]))}<br>
          ${escapeHTML(getValue(row, ["Kuupäev", "kuupäev"]))}<br>
          🕒 ${escapeHTML(getValue(row, ["Kellaaeg", "kellaaeg"]))}<br>
          🏷 ${escapeHTML(getValue(row, ["Kaubatüüp", "kaubatüüp"]))}<br>
          ${escapeHTML(getValue(row, ["Kaup", "kaup"]))}<br>
          🔗 ${createWebLink(row)}
        `);

        marker.on("click", () => {
          map.flyTo([lat, lng], 17, { duration: 0.7 });
        });

        markers.addLayer(marker);
      });
    }

    function zoomToResults(data) {
      const points = data.map(row => {
        const lat = parseFloat(getValue(row, ["Latitude", "latitude", "Laiuskraad"]));
        const lng = parseFloat(getValue(row, ["Longitude", "longitude", "Pikkuskraad"]));

        return isNaN(lat) || isNaN(lng) ? null : [lat, lng];
      }).filter(Boolean);

      if (points.length === 1) {
        map.setView(points[0], 14);
      } else if (points.length > 1) {
        map.fitBounds(points, {
          padding: [40, 140],
          maxZoom: 14
        });
      }
    }

    function applyFilters() {
      const search = normalize(document.getElementById("search").value);
      const filter = normalize(document.getElementById("filter").value);

      const filtered = allData.filter(row => {
        const city = normalize(getValue(row, ["Linn", "linn"]));
        const address = normalize(getValue(row, ["Aadress", "aadress"]));
        const name = normalize(getValue(row, ["Nimi", "nimi"]));
        const rowCategories = getCategories(row);

        const searchMatch =
          city.includes(search) ||
          address.includes(search) ||
          name.includes(search) ||
          rowCategories.some(category => category.includes(search));

        const categoryMatch =
          filter === "all" || rowCategories.includes(filter);

        return searchMatch && categoryMatch;
      });

      renderMarkers(filtered);

      if (search || filter !== "all") {
        zoomToResults(filtered);
      } else {
        map.setView(estoniaCenter, estoniaZoom);
      }

      document.getElementById("status").textContent =
        `Leitud kuulutusi: ${filtered.length}`;
    }

    function openCreateForm() {
      editToken = "";
      document.getElementById("form-title").textContent = "Lisa müügikoht";
      document.getElementById("submit-button").textContent = "Avalda";
      document.getElementById("listing-form").reset();
      document.getElementById("form-result").innerHTML = "";
      document.getElementById("listing-modal").classList.add("visible");
    }

    function closeForm() {
      document.getElementById("listing-modal").classList.remove("visible");
    }

    function setFormValue(id, value) {
      document.getElementById(id).value = value || "";
    }

    async function openEditForm(token) {
      editToken = token;
      document.getElementById("form-title").textContent = "Muuda müügikohta";
      document.getElementById("submit-button").textContent = "Salvesta muudatused";
      document.getElementById("form-result").innerHTML = "";
      document.getElementById("listing-modal").classList.add("visible");

      try {
        const response = await fetch(
          `${API_URL}?action=get&token=${encodeURIComponent(token)}`
        );

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || "Muutmislink ei kehti.");
        }

        const row = result.data;

        setFormValue("form-name", getValue(row, ["Nimi", "nimi"]));
        setFormValue("form-address", getValue(row, ["Aadress", "aadress"]));
        setFormValue("form-date", getValue(row, ["Kuupäev", "kuupäev"]));
        setFormValue("form-time", getValue(row, ["Kellaaeg", "kellaaeg"]));
        setFormValue("form-category", getValue(row, ["Kaubatüüp", "kaubatüüp"]));
        setFormValue("form-description", getValue(row, ["Kaup", "kaup"]));
        setFormValue("form-phone", getValue(row, [
          "Mobiilinumber/E-post",
          "mobiilinumber/e-post"
        ]));
        setFormValue("form-website", getValue(row, ["Veeb", "veeb"]));
      } catch (error) {
        document.getElementById("form-result").className = "error";
        document.getElementById("form-result").textContent = error.message;
      }
    }

    document.getElementById("listing-form").addEventListener("submit", async event => {
      event.preventDefault();

      const resultBox = document.getElementById("form-result");
      const button = document.getElementById("submit-button");

      resultBox.className = "";
      resultBox.textContent = "Salvestan…";
      button.disabled = true;

      const data = {
        action: editToken ? "update" : "create",
        token: editToken,
        name: document.getElementById("form-name").value.trim(),
        address: document.getElementById("form-address").value.trim(),
        date: document.getElementById("form-date").value,
        time: document.getElementById("form-time").value,
        category: document.getElementById("form-category").value,
        description: document.getElementById("form-description").value.trim(),
        phone: document.getElementById("form-phone").value.trim(),
        website: document.getElementById("form-website").value.trim()
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || "Salvestamine ebaõnnestus.");
        }

        await loadListings();

        resultBox.className = "success";

        if (editToken) {
          resultBox.textContent = "Muudatused on salvestatud.";
        } else {
          const editUrl =
            `${location.origin}${location.pathname}?muuda=` +
            encodeURIComponent(result.editToken);

          resultBox.innerHTML =
            `Müügikoht on avaldatud.<br><br>` +
            `Salvesta see privaatne muutmislink:<br>` +
            `<a href="${escapeHTML(editUrl)}">${escapeHTML(editUrl)}</a>`;
        }
      } catch (error) {
        resultBox.className = "error";
        resultBox.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    fillBanners();
    loadListings();

    const token = new URLSearchParams(location.search).get("muuda");

    if (token) {
      openEditForm(token);
    }
  </script>
</body>
</html>
